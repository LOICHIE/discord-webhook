name: Discord Webhook Test

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Send and delete 20 messages per channel
        env:
          WEBHOOK1: ${{ secrets.DISCORD_WEBHOOK_1 }}
          WEBHOOK2: ${{ secrets.DISCORD_WEBHOOK_2 }}
          WEBHOOK3: ${{ secrets.DISCORD_WEBHOOK_3 }}
        run: |
          for WEBHOOK in "$WEBHOOK1" "$WEBHOOK2" "$WEBHOOK3"; do
            for i in {1..20}; do

              RESPONSE=$(curl -sS -X POST \
                -H "Content-Type: application/json" \
                -d '{"content":"@everyone GET THE FUCK ONLINE"}' \
                "$WEBHOOK?wait=true")

              MESSAGE_ID=$(echo "$RESPONSE" | python -c "import sys,json; print(json.load(sys.stdin)['id'])")

              curl -sS -X DELETE \
                "$WEBHOOK/messages/$MESSAGE_ID"

            done
          done
