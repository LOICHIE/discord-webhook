name: Discord Webhook

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord message
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
            -d '{"content":"@everyone CODE","allowed_mentions":{"parse":["everyone"]}}' \
            "$WEBHOOK"
