name: Discord Webhook Test

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Send 20 messages
        env:
          WEBHOOK1: ${{ secrets.DISCORD_WEBHOOK_1 }}
          WEBHOOK2: ${{ secrets.DISCORD_WEBHOOK_2 }}
          WEBHOOK3: ${{ secrets.DISCORD_WEBHOOK_3 }}
        run: |
          for i in {1..20}; do
            WEBHOOK=$(( (i - 1) % 3 + 1 ))

            if [ "$WEBHOOK" = "1" ]; then
              URL="$WEBHOOK1"
            elif [ "$WEBHOOK" = "2" ]; then
              URL="$WEBHOOK2"
            else
              URL="$WEBHOOK3"
            fi

            curl -sS -H "Content-Type: application/json" \
              -d '{"content":"@everyone GET ONLINE"}' \
              "$URL"
          done
